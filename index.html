<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>تكفيتا</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ecec;--card:#fff;--ink:#2a1a1e;--mut:#7d6a6e;--red:#8f3547;--me:#8f3547;--meink:#fff;--him:#fff;--line:#e6d6d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1214;--card:#261a1d;--ink:#f3e6e8;--mut:#b09a9e;--red:#c25a70;--me:#8f3547;--line:#3a2a2e}}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--him:#2f2024}}
:root[data-theme="dark"]{--bg:#1a1214;--card:#261a1d;--ink:#f3e6e8;--mut:#b09a9e;--red:#c25a70;--me:#8f3547;--him:#2f2024;--line:#3a2a2e}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;font-size:16px}
#app{height:100%;max-width:520px;margin:auto;display:flex;flex-direction:column}
.login{margin:auto;width:100%;padding:24px;text-align:center}
.login img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid var(--red)}
.login h1{font-size:34px;font-weight:600;margin:12px 0 4px}.login p{color:var(--mut);margin:0 0 20px}
input[type=email],input[type=password],#msg{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--red);color:#fff;font-weight:600}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
header img,.ini{width:42px;height:42px;border-radius:50%;object-fit:cover}
.ini{background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
header b{display:block;line-height:1.2}header small{color:var(--mut)}
.ic{background:none;border:0;color:var(--ink);font-size:22px;padding:6px}
#list{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;padding:8px 12px;border-radius:14px;background:var(--him);border:1px solid var(--line);line-height:1.5;word-wrap:break-word}
.m.me{align-self:flex-start;background:var(--me);color:var(--meink);border-color:var(--me)}
.m.him{align-self:flex-end}
.m time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.m audio{height:34px;max-width:100%}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
#msg{margin:0;flex:1}
.rd{width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:20px;flex:none}
.rd.rec{background:#d12f2f;outline:3px solid #d12f2f55}
.btn2{background:transparent;color:var(--red);border:1px solid var(--red);margin-top:8px}.empty{margin:auto;color:var(--mut);text-align:center}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;display:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style></head><body><div id="app"></div><div id="toast"></div>
<input type="file" id="pic" accept="image/*" hidden>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,collection,addDoc,query,orderBy,onSnapshot,serverTimestamp,doc,setDoc} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCRI3e-A43I6qfX2_avD48VMhusHPzXHak",authDomain:"takfita-92e8d.firebaseapp.com",projectId:"takfita-92e8d",storageBucket:"takfita-92e8d.firebasestorage.app",messagingSenderId:"11900750702",appId:"1:11900750702:web:aff7dd92a8e2cc2ace4f7f"};
const fb=initializeApp(cfg),auth=getAuth(fb),db=getFirestore(fb);
const AV="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' fill='%238f3547'/%3E%3Ctext x='48' y='64' font-size='52' text-anchor='middle'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E",app=document.getElementById('app');
var me={email:'',av:AV},friend='',fav='',rec=null,chunks=[],unsubs=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none'},3000)}
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function stop(){unsubs.forEach(function(u){u()});unsubs=[]}
function errMsg(c){var m={'auth/invalid-credential':'الإيميل ولا كلمة السر غالطين','auth/email-already-in-use':'هذا الإيميل عندو حساب، دير دخول','auth/weak-password':'كلمة السر 6 حروف على الأقل','auth/invalid-email':'اكتب إيميل صحيح','auth/network-request-failed':'ما كاينش إنترنت','auth/unauthorized-domain':'الدومين ما مضافش في Firebase'};return m[c]||'صرات مشكلة: '+c}
function login(){stop();
app.innerHTML='<div class="login"><img src="'+AV+'" alt="تكفيتا"><h1>تكفيتا</h1><p>دردشة بيني وبين صاحبي</p><input type="email" id="em" placeholder="name@gmail.com" dir="ltr" autocomplete="email"><input type="password" id="pw" placeholder="كلمة السر" dir="ltr"><button class="btn" id="go">دخول</button><button class="btn btn2" id="new">حساب جديد</button></div>';
function val(){var e=document.getElementById('em').value.trim().toLowerCase(),p=document.getElementById('pw').value;
if(!/^\S+@\S+\.\S+$/.test(e)){toast('اكتب إيميل صحيح');return null}
if(p.length<6){toast('كلمة السر 6 حروف على الأقل');return null}return[e,p]}
document.getElementById('go').onclick=function(){var v=val();if(v)signInWithEmailAndPassword(auth,v[0],v[1]).catch(function(e){toast(errMsg(e.code))})};
document.getElementById('new').onclick=function(){var v=val();if(v)createUserWithEmailAndPassword(auth,v[0],v[1]).catch(function(e){toast(errMsg(e.code))})}}
function askFriend(){stop();
app.innerHTML='<div class="login"><h1>مع من تهدر؟</h1><p>اكتب إيميل صاحبك (الحساب اللي يدخل بيه لتكفيتا)</p><input type="email" id="fe" placeholder="friend@gmail.com" dir="ltr"><button class="btn" id="ok">ابدا</button><button class="btn btn2" id="out">خروج</button></div>';
document.getElementById('ok').onclick=function(){var v=document.getElementById('fe').value.trim().toLowerCase();
if(!/^\S+@\S+\.\S+$/.test(v)||v===me.email){toast('اكتب إيميل صاحبك الصحيح');return}
friend=v;lsSet('tk_friend_'+me.email,v);chat()};
document.getElementById('out').onclick=function(){signOut(auth)}}
function now(d){return d?d.toDate().toLocaleTimeString('ar-DZ',{hour:'2-digit',minute:'2-digit'}):''}
function small(file,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var c=document.createElement('canvas');c.width=c.height=96;var x=c.getContext('2d'),s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);cb(c.toDataURL('image/jpeg',0.7))};i.src=r.result};r.readAsDataURL(file)}
function chat(){stop();
var id=[me.email,friend].sort().join('__'),col=collection(db,'chats',id,'messages');
var fname=friend.split('@')[0];
app.innerHTML='<header><img id="mypic" src="'+esc(me.av)+'" alt="صورتك" title="بدّل صورتك" style="cursor:pointer"><div style="flex:1"><b>'+esc(fname)+'</b><small>'+esc(friend)+'</small></div><button class="ic" id="th" aria-label="الوضع الليلي">&#9790;</button><button class="ic" id="out" aria-label="خروج">&#10006;</button></header><div id="list"><p class="empty" id="em0">ابدا الهدرة مع صاحبك</p></div><div class="bar"><input id="msg" placeholder="اكتب رسالة" autocomplete="off"><button class="rd" id="mic" aria-label="رسالة صوتية">&#127908;</button><button class="rd" id="snd" aria-label="إرسال">&#10148;</button></div>';
var pic=document.getElementById('pic'),msg=document.getElementById('msg'),list=document.getElementById('list');
document.getElementById('mypic').onclick=function(){pic.click()};
pic.onchange=function(){var f=pic.files[0];if(!f)return;small(f,function(d){me.av=d;document.getElementById('mypic').src=d;setDoc(doc(db,'profiles',me.email),{av:d}).then(function(){toast('تبدلت الصورة')}).catch(function(){toast('ما تحفظتش الصورة')})})};
document.getElementById('th').onclick=function(){var d=document.documentElement;d.setAttribute('data-theme',d.getAttribute('data-theme')==='dark'?'light':'dark')};
document.getElementById('out').onclick=function(){signOut(auth)};
unsubs.push(onSnapshot(doc(db,'profiles',friend),function(s){var d=s.data();fav=d&&d.av?d.av:'';render.last&&render(render.last)}));
unsubs.push(onSnapshot(doc(db,'profiles',me.email),function(s){var d=s.data();if(d&&d.av){me.av=d.av;var p=document.getElementById('mypic');if(p)p.src=d.av}}));
function render(snap){render.last=snap;list.innerHTML='';
if(snap.empty){list.innerHTML='<p class="empty">ابدا الهدرة مع صاحبك</p>';return}
snap.forEach(function(s){var m=s.data(),mine=m.from===me.email,d=document.createElement('div');d.className='m '+(mine?'me':'him');
var body=m.kind==='voice'&&/^data:audio\//.test(m.audio||'')?'<audio controls src="'+m.audio+'"></audio>':esc(m.text||'');
d.innerHTML=body+'<time>'+now(m.ts)+'</time>';list.appendChild(d)});
list.scrollTop=list.scrollHeight}
unsubs.push(onSnapshot(query(col,orderBy('ts')),render,function(){toast('ما نقدرش نقرا الرسائل، شوف القواعد في Firebase')}));
function send(o){o.from=me.email;o.ts=serverTimestamp();return addDoc(col,o).catch(function(){toast('الرسالة ما وصلتش')})}
function sendText(){var t=msg.value.trim();if(!t)return;msg.value='';send({kind:'text',text:t})}
document.getElementById('snd').onclick=sendText;msg.onkeydown=function(e){if(e.key==='Enter')sendText()};
document.getElementById('mic').onclick=function(){var b=this;
if(rec){rec.stop();return}
if(!navigator.mediaDevices||!window.MediaRecorder){toast('المتصفح ما يدعمش التسجيل');return}
navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){chunks=[];var r=new MediaRecorder(s);rec=r;var tm=setTimeout(function(){if(rec)rec.stop()},40000);
r.ondataavailable=function(e){chunks.push(e.data)};
r.onstop=function(){clearTimeout(tm);s.getTracks().forEach(function(t){t.stop()});b.classList.remove('rec');rec=null;
var fr=new FileReader();fr.onload=function(){if(fr.result.length>900000){toast('التسجيل طويل بزاف، قصّرو');return}send({kind:'voice',audio:fr.result})};fr.readAsDataURL(new Blob(chunks,{type:r.mimeType}))};
r.start();b.classList.add('rec');toast('يسجل... اضغط مرة أخرى للإيقاف (40 ثانية كحد أقصى)')}).catch(function(){toast('لازم تسمح للميكروفون')})}}
onAuthStateChanged(auth,function(u){if(!u){login();return}
me.email=u.email.toLowerCase();friend=lsGet('tk_friend_'+me.email);friend?chat():askFriend()});
</script>
</body></html>
